    </style>

<body class="bg-gray-50 dark:bg-gray-900 antialiased">

    <div class="flex flex-col h-screen">

                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-4 space-y-4">
                    <div><h3 class="text-sm font-semibold mb-3 text-gray-700 dark:text-gray-300" data-key="teamDataTitle"></h3><div class="grid grid-cols-2 gap-2"><button id="importBtn" class="flex items-center justify-center p-2 bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300 rounded-md"><svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg><span data-key="importJsonButton"></span></button><button id="clearAllBtn" class="flex items-center justify-center p-2 bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300 rounded-md"><svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg><span data-key="clearAllButton"></span></button></div></div>

    <div id="reportContainer" class="report-container"></div>

    <script>
    // ========================
    // I18N - Configurações de Idioma

    /**
     * Sanitizes HTML string to prevent XSS attacks
     * @param {string} str - The string to sanitize
     * @returns {string} Sanitized string
     */
    function sanitizeHTML(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    /**
     * Escapes HTML special characters
     * @param {string} str - The string to escape
     * @returns {string} Escaped string
     */
    function escapeHTML(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    /**
     * Debounce function to limit execution rate
     * @param {Function} func - Function to debounce
     * @param {number} wait - Wait time in milliseconds
     * @returns {Function} Debounced function
     */
    function debounce(func, wait = 300) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    /**
     * Validates member data
     * @param {Object} data - Member data to validate
     * @returns {Object} Validation result with isValid and errors
     */
    function validateMemberData(data) {
        const errors = [];

        if (!data.name || data.name.trim().length === 0) {
            errors.push('Nome é obrigatório');
        } else if (data.name.trim().length > 50) {
            errors.push('Nome deve ter no máximo 50 caracteres');
        }

        if (!data.state || !brazilStates[data.state]) {
            errors.push('Estado inválido');
        }

        if (data.phone && !/^[\d\s\(\)\-\+]+$/.test(data.phone)) {
            errors.push('Telefone contém caracteres inválidos');
        }

        if (data.city && data.city.length > 100) {
            errors.push('Nome da cidade muito longo');
        }

        return {
            isValid: errors.length === 0,
            errors
        };
    }

    /**

            // Convert coordinates to Leaflet format [lat, lng]
            const leafletCoords = regionData.coordinates.map(ring =>
                ring.map(coord => [coord[1], coord[0]])
            );

            const polygon = L.polygon(leafletCoords, {
                color: color,
                fillColor: 'transparent',
                fillOpacity: 0,           // No fill - only borders
                weight: 3,                // Thicker line for visibility
                opacity: 0.7,             // Slightly transparent
                dashArray: '10, 5'        // Dashed line pattern
            }).addTo(map);

            // Add tooltip on hover
            polygon.bindTooltip(regionName, {
                permanent: false,
                direction: 'center',
                className: 'region-tooltip'
            });

            regionLayers[regionName] = { polygon };
        });

    /**
     * Updates all markers on the map, grouping by city location
     */
    function updateAllMarkersOnMap() {
        markerLayerGroup.clearLayers();
        Object.keys(markers).forEach(key => delete markers[key]);

        // Group members by location (city coordinates)
        const membersByLocation = {};

        members.forEach(member => {
            // For legacy members without coordinates, use state center
            const lat = member.lat !== undefined ? member.lat : brazilStates[member.state].lat;
            const lon = member.lon !== undefined ? member.lon : brazilStates[member.state].lon;

            // Create a location key (rounded to avoid floating point issues)
            const locationKey = `${lat.toFixed(4)},${lon.toFixed(4)}`;

            if (!membersByLocation[locationKey]) {
                membersByLocation[locationKey] = {
                    lat,
                    lon,
                    members: []
                };
            }

            membersByLocation[locationKey].members.push(member);
        });

        // Distribute markers for each location
        Object.values(membersByLocation).forEach(location => {
            const totalAtLocation = location.members.length;

            location.members.forEach((member, index) => {
                let markerLat, markerLon;

                if (totalAtLocation > 1) {
                    // Distribute in a circle around the location
                    const angle = (360 / totalAtLocation) * index;
                    const radians = angle * (Math.PI / 180);
                    const radius = DISTRIBUTION_RADIUS * 0.15; // Smaller radius for city-level distribution
                    markerLat = location.lat + radius * Math.cos(radians);
                    markerLon = location.lon + radius * Math.sin(radians);
                } else {
                    // Single member at location
                    markerLat = location.lat;
                    markerLon = location.lon;
                }

                addMarkerToMap(member, markerLat, markerLon);
            });
        });
    }

    /**
     * Gets coordinates for a city using Nominatim geocoding API
     * @param {string} city - City name
     * @param {string} stateCode - State code (e.g., 'SP')
     * @returns {Promise<Object>} Object with lat and lon properties
     */
    async function getCityCoordinates(city, stateCode) {
        // If no city provided, use state center
        if (!city) {
            const state = brazilStates[stateCode];
            return { lat: state.lat, lon: state.lon };
        }

        try {
            const stateName = brazilStates[stateCode].name;
            const url = `https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(city)}&state=${encodeURIComponent(stateName)}&country=Brazil&format=json&limit=1`;

            const response = await fetch(url, {
                headers: {
                    'User-Agent': 'EquipeRegioesBrasil/1.0'
                }
            });

            if (!response.ok) {
                throw new Error('Geocoding failed');
            }

            const data = await response.json();

            if (data.length > 0) {
                return {
                    lat: parseFloat(data[0].lat),
                    lon: parseFloat(data[0].lon)
                };
            } else {
                // Fallback to state center if city not found
                const state = brazilStates[stateCode];
                return { lat: state.lat, lon: state.lon };
            }
        } catch (error) {
            console.error('Geocoding error:', error);
            // Fallback to state center
            const state = brazilStates[stateCode];
            return { lat: state.lat, lon: state.lon };
        }
    }

    /**
     * Adds a new member to the team
     * @param {Object} data - Member data
     */
    async function addMember(data) {
        // Sanitize all input fields
        const sanitizedData = {
            name: cleanInput(data.name),
            phone: cleanInput(data.phone),
            state: data.state,
            city: cleanInput(data.city),
            isLeader: Boolean(data.isLeader)
        };

        // Validate data
        const validation = validateMemberData(sanitizedData);
        if (!validation.isValid) {
            showNotification(validation.errors.join(', '), 'error');
            return;
        }

        if (sanitizedData.isLeader) {
            const state = brazilStates[sanitizedData.state];
            const region = state.region;
            const leader = members.find(m => brazilStates[m.state]?.region === region && m.isLeader);
            if (leader) {
                showNotification(getTranslatedString('notificationRegionHasLeader', { region, leaderName: leader.name }), 'warning');
                return;
            }
        }

        // Show loading notification
        const cityName = sanitizedData.city || brazilStates[sanitizedData.state].name;
        showNotification(`Localizando ${cityName}...`, 'info');

        // Get city coordinates
        const coords = await getCityCoordinates(sanitizedData.city, sanitizedData.state);

        const newMember = {
            id: Date.now().toString(),
            createdAt: new Date().toISOString(),
            ...sanitizedData,
            lat: coords.lat,
            lon: coords.lon
        };

        members.push(newMember);
        saveToLocalStorage();
        updateAllMarkersOnMap();
        updateAllUI();
        showNotification(getTranslatedString('notificationMemberAdded', { name: sanitizedData.name }), 'success');
        document.getElementById('addMemberForm').reset();

    function updateMemberDetails(id, details) {
        const index = members.findIndex(m => m.id === id);
        if (index === -1) return;

        // Sanitize all input fields
        const sanitizedDetails = {
            name: cleanInput(details.name),
            phone: cleanInput(details.phone),
            isLeader: Boolean(details.isLeader)
        };

        // Preserve existing location data (state, city, lat, lon)
        const member = { ...members[index], ...sanitizedDetails };

        // Validate data
        const validation = validateMemberData(member);
        if (!validation.isValid) {
            showNotification(validation.errors.join(', '), 'error');
            return;
        }

        if (member.isLeader) {
            const state = brazilStates[member.state];
            const region = state.region;
            const leader = members.find(m => m.id !== id && brazilStates[m.state]?.region === region && m.isLeader);

                showNotification(getTranslatedString('notificationRegionHasLeader', { region, leaderName: leader.name }), 'warning');

            }
        }

        members[index] = member;
        saveToLocalStorage();
        updateAllMarkersOnMap();
        updateAllUI();
        showNotification(getTranslatedString('notificationMemberUpdated', { name: sanitizedDetails.name }), 'success');
        hideEditModal();

    /**
     * Loads cities from IBGE API for a given state
     * @param {string} stateCode - Two-letter state code (e.g., 'SP')
     */
    async function loadCitiesForState(stateCode) {
        const citySelect = document.getElementById('memberCity');

        if (!stateCode) {
            citySelect.innerHTML = '<option value="">Selecione um estado primeiro</option>';
            citySelect.disabled = true;
            return;
        }

        // Show loading state
        citySelect.innerHTML = '<option value="">Carregando cidades...</option>';
        citySelect.disabled = true;

        try {
            const response = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${stateCode}/municipios`);

            if (!response.ok) {
                throw new Error('Falha ao carregar cidades');
            }

            const cities = await response.json();

            // Populate cities dropdown
            citySelect.innerHTML = '<option value="">Selecione uma cidade (opcional)</option>';
            cities.sort((a, b) => a.nome.localeCompare(b.nome)).forEach(city => {
                const option = document.createElement('option');
                option.value = city.nome;
                option.textContent = city.nome;
                citySelect.appendChild(option);
            });

            citySelect.disabled = false;
        } catch (error) {
            console.error('Error loading cities:', error);
            citySelect.innerHTML = '<option value="">Erro ao carregar cidades</option>';
            showNotification('Erro ao carregar cidades. Tente novamente.', 'error');
        }
    }

    function toggleMapType() {
        const types = Object.keys(mapTiles);
        const currentIndex = types.indexOf(currentMapType);
        currentMapType = types[(currentIndex + 1) % types.length];

        // Remove current tile layer
        if (currentTileLayer) {
            map.removeLayer(currentTileLayer);
        }

        // Add new tile layer
        currentTileLayer = L.tileLayer(mapTiles[currentMapType], {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Move tile layer to back (behind region lines and markers)
        currentTileLayer.bringToBack();

        showNotification(
            getTranslatedString('notificationMapTypeChanged', {
                type: getTranslatedString(`mapType${currentMapType.charAt(0).toUpperCase() + currentMapType.slice(1)}`)
            }),
            'info'

    }

            </div>
            <div style="display:flex;gap:40px;">
                <div style="flex:1;"><h2 style="font-size:22px;font-weight:700;margin-bottom:15px;">${getTranslatedString('reportDistributionByState')}</h2>${sortedStates.map(([code, count]) => { const p = (count / regionMembers.length * 100).toFixed(1); return `<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:14px;"><span>${brazilStates[code].name}</span><strong>${count} (${p}%)</strong></div><div style="width:100%;background:#e5e7eb;height:8px;border-radius:4px;margin-top:4px;"><div style="height:8px;background:${color.bg};width:${p}%;border-radius:4px;"></div></div></div>`; }).join('')}</div>
                <div style="flex:1;"><h2 style="font-size:22px;font-weight:700;margin-bottom:15px;">${getTranslatedString('reportMemberList')}</h2><ul style="list-style:none;padding:0;max-height:400px;overflow-y:auto;">${regionMembers.sort((a, b) => a.name.localeCompare(b.name)).map(m => `<li style="padding:8px 0;font-size:14px;border-bottom:1px solid #f3f4f6;"><strong>${m.name}</strong> - ${m.city || brazilStates[m.state].name}, ${m.state}</li>`).join('')}</ul></div>
            </div>
        </div>`;
    }
    </script>
</body>
</html>
